# maskrcnn_adam3d.yaml sized for a 5 GB GPU (Quadro P2000, ~3.9 GB free).
#
# Measured on the P2000 at 1024x1024 training crops:
#   train batch 1: 0.61 s/step, 2.1 GB    train batch 2: 1.12 s/step, 3.7 GB
#   train batch 3+: does not fit; Windows spills it into system RAM, 10-20x slower
#   validation (full 1024x1280): 0.79 s/image with val loss, 0.47 s/image without
#
# Differences from maskrcnn_adam3d.yaml, chosen to see the same 80,000 training
# images with the same schedule shape:
#   train_batch_size 4 -> 1, lr 0.01 -> 0.0025 (linear scaling),
#   max_steps 20000 -> 80000, warmup_steps 500 -> 2000,
#   val_check_interval 500 -> 4000 (20 validations of ~4.5 min each),
#   eval_batch_size 2 -> 1, num_workers 8 -> 2.
# Expected time: about 14 h of training plus 1.5 h of validation.
#
# Run:
#   python main.py --config configs/experiments/maskrcnn_adam3d_p2000.yaml

experiment:
  name: maskrcnn_adam3d_p2000
  seed: 42
  supervision_regime: fully_supervised
  save_per_image_metrics: true
  # Also score all test images in one pass (a `pooled` row in metrics.csv).
  # The pixel curve metrics hold every test pixel in memory: budget ~35 GB of
  # RAM for the 432 full-resolution test images. Per-part rows need up to ~6 GB.
  test_pooled: false
  # parts: [1M1, SpurGear]   # default: every part in the test annotations
model:
  class_path: maskrcnn_modules.maskrcnn.MaskRCNN
  init_args:
    num_classes: 12           # 11 defect types + background
    backbone: resnet50
    pretrained: coco
    trainable_backbone_layers: 3
    min_size: 1024            # native resolution: no downscaling of 1024x1280 images
    max_size: 1280
    box_score_thresh: 0.05
    box_detections_per_img: 100
    lr: 0.0025
    momentum: 0.9
    weight_decay: 0.001
    warmup_steps: 2000
    gradient_clip_val: 35.0
    log_val_loss: true
data:
  class_path: maskrcnn_modules.data.CocoInstanceDataModule
  init_args:
    # Root of 3d-adam-full-masked: the annotation file_name values are relative to it.
    root: D:/Data/3d-adam-full-masked
    train_ann_file: adam3d/superdefect_default/annotations_train.json
    val_ann_file: adam3d/superdefect_default/annotations_val.json
    test_ann_file: adam3d/superdefect_default/annotations_test.json
    # Defect types to treat as background in training and evaluation. Empty
    # keeps every annotated defect. SuperDefect's default.yaml ignores
    # [gap, mark, roughess, scratch, warp]; the equivalent here is
    # [gap, mark, scratch, warp] (no roughess masks exist in the Nano images).
    ignore_classes: []
    train_batch_size: 1
    eval_batch_size: 1
    num_workers: 2            # one worker prepares ~9 images/s; the GPU trains ~1.7 images/s
    train_augment: true
    crop_size: 1024
    resize_range: [1024, 1434]
trainer:
  accelerator: gpu               # fail instead of silently training on the CPU
  devices: 1
  precision: 32                  # Pascal GPUs run fp16 far slower than fp32: no mixed precision
  max_steps: 80000
  val_check_interval: 4000
  check_val_every_n_epoch: null   # count val_check_interval in steps across epochs
  log_every_n_steps: 50
results_dir: ./results
logging:
  wandb:
    project: SuperDefectExperiments
    entity: null
    group: maskrcnn_adam3d_p2000
